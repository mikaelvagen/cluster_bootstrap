apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: gitea
  namespace: gitea
spec:
  parentRefs:
    - name: main
      namespace: gateway
      sectionName: http
  hostnames:
    - gitea.varlamore.gielinor
  rules:
    - backendRefs:
        - name: gitea-http
          port: 3000
