apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: gitea
  namespace: gitea
spec:
  interval: 30m
  chart:
    spec:
      chart: gitea
      version: "12.7.0"
      sourceRef:
        kind: HelmRepository
        name: gitea-charts
  valuesFrom:
    - kind: Secret
      name: gitea-secret-values 
      valuesKey: values.yaml
  values:
    gitea:
      admin:
        username: admin
        email: admin@varlamore.com
      config:
        server:
          ROOT_URL: http://localhost:3000
        session:
          PROVIDER: db
        cache:
          ADAPTER: memory
        queue:
          TYPE: level
    persistence:
      enabled: true
      size: 10Gi
    postgresql-ha:
      enabled: false
    postgresql:
      enabled: true
    valkey-cluster:
      enabled: false
    valkey:
      enabled: false
