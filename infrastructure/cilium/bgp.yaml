apiVersion: cilium.io/v2
kind: CiliumBGPClusterConfig
metadata:
  name: fortigate
spec:
  bgpInstances:
    - name: cluster
      localASN: 65200
      peers:
        - name: fortigate
          peerASN: 65100
          peerAddress: 10.10.1.1
          peerConfigRef:
            name: fortigate
---
apiVersion: cilium.io/v2
kind: CiliumBGPPeerConfig
metadata:
  name: fortigate
spec:
  timers:
    holdTimeSeconds: 9
    keepAliveTimeSeconds: 3
  gracefulRestart:
    enabled: true
    restartTimeSeconds: 15
  families:
    - afi: ipv4
      safi: unicast
      advertisements:
        matchLabels:
          advertise: bgp
---
apiVersion: cilium.io/v2
kind: CiliumBGPAdvertisement
metadata:
  name: loadbalancer-ips
  labels:
    advertise: bgp
spec:
  advertisements:
    - advertisementType: Service
      service:
        addresses:
          - LoadBalancerIP
      selector:
        matchExpressions:
          - { key: somekey, operator: NotIn, values: ["never-used-value"] }
