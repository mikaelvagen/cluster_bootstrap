apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: apps
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 1m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system        # the repo flux bootstrap sets up, i.e. varlamore-seed
  path: ./apps
  prune: true                # delete it from Git = delete it from the cluster
  wait: true                 # only report Ready when everything it applied is healthy
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  dependsOn:
    - name: infrastructure
