apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: varlamore-apps
  namespace: flux-system
spec:
  interval: 1m
  url: ssh://git@gitea-ssh.gitea.svc.cluster.local/zanaris/varlamore_apps.git
  ref:
    branch: main
  secretRef:
    name: gitea-varlamore-apps
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: varlamore-apps
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 1m
  timeout: 15m
  sourceRef:
    kind: GitRepository
    name: varlamore-apps
  path: ./
  prune: true
  wait: true
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  dependsOn:
    - name: apps 